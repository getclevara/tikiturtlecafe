<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1040" height="720" fill="#0e1418"/>

  <text x="40" y="46" fill="#fffcf7" font-size="23" font-weight="700">Proposed service pass-through — west end wall</text>
  <text x="40" y="70" fill="#ff7b7b" font-size="13" font-weight="700">NOT ON THE PERMIT SET · for review by Alluminated (Andrew Ling)</text>
  <text x="40" y="90" fill="#8fa3ad" font-size="13">ARC of Hilo culinary incubator · kitchen to Cafe POS / front of house</text>

  <!-- ============================ ELEVATION ============================ -->
  <text x="40" y="134" fill="#12b5c4" font-size="13" font-weight="700" letter-spacing="1.5">ELEVATION — VIEWED FROM THE KITCHEN</text>

  <!-- wall -->
  <rect x="40" y="150" width="560" height="380" fill="#182028"/>
  <!-- floor line -->
  <line x1="40" y1="530" x2="600" y2="530" stroke="#5a6b75" stroke-width="3"/>

  <!-- opening: sill 40" head 78" => 38" tall. scale 5 px = 1 inch -->
  <!-- floor at y=530, so sill y = 530 - 40*5 = 330 ; head y = 530 - 78*5 = 140 -->
  <rect x="160" y="330" width="310" height="0" fill="none"/>
  <rect x="160" y="140" width="310" height="190" fill="#3a2a12"/>
  <rect x="160" y="140" width="310" height="190" fill="none" stroke="#ff7b7b" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="315" y="242" fill="#ffc981" font-size="14" text-anchor="middle">opening to cafe</text>

  <!-- stainless surround -->
  <rect x="148" y="128" width="334" height="14" fill="#8e99a3"/>
  <rect x="148" y="330" width="334" height="16" fill="#8e99a3"/>
  <rect x="148" y="128" width="14" height="218" fill="#8e99a3"/>
  <rect x="468" y="128" width="14" height="218" fill="#8e99a3"/>

  <!-- plating ledge (seen edge-on in elevation) -->
  <rect x="140" y="346" width="350" height="9" fill="#b8c0c8"/>
  <!-- ledge brackets -->
  <rect x="176" y="355" width="8" height="30" fill="#6f7b85"/>
  <rect x="311" y="355" width="8" height="30" fill="#6f7b85"/>
  <rect x="446" y="355" width="8" height="30" fill="#6f7b85"/>
  <!-- heat lamp shelf -->
  <rect x="150" y="176" width="330" height="8" fill="#8e99a3"/>
  <rect x="196" y="184" width="60" height="7" fill="#f59e42"/>
  <rect x="286" y="184" width="60" height="7" fill="#f59e42"/>
  <rect x="376" y="184" width="60" height="7" fill="#f59e42"/>
  <text x="496" y="186" fill="#f59e42" font-size="11.5">heat lamps</text>

  <!-- dimensions -->
  <g stroke="#6f8593" stroke-width="1" fill="#a9bcc6" font-size="12">
    <line x1="160" y1="108" x2="470" y2="108"/>
    <line x1="160" y1="102" x2="160" y2="114"/>
    <line x1="470" y1="102" x2="470" y2="114"/>
    <text x="315" y="100" text-anchor="middle" fill="#a9bcc6">5′-2″ clear opening</text>

    <line x1="624" y1="140" x2="624" y2="330"/>
    <line x1="618" y1="140" x2="630" y2="140"/>
    <line x1="618" y1="330" x2="630" y2="330"/>
    <text x="638" y="240" fill="#a9bcc6">38″ opening height</text>

    <line x1="700" y1="330" x2="700" y2="530"/>
    <line x1="694" y1="330" x2="706" y2="330"/>
    <line x1="694" y1="530" x2="706" y2="530"/>
    <text x="714" y="436" fill="#a9bcc6">40″ sill (ledge height)</text>

    <line x1="770" y1="140" x2="770" y2="530"/>
    <line x1="764" y1="140" x2="776" y2="140"/>
    <line x1="764" y1="530" x2="776" y2="530"/>
    <text x="784" y="340" fill="#a9bcc6">78″ head</text>
  </g>

  <!-- ============================== PLAN =============================== -->
  <text x="40" y="586" fill="#12b5c4" font-size="13" font-weight="700" letter-spacing="1.5">PLAN DETAIL</text>

  <!-- wall in section -->
  <rect x="300" y="606" width="26" height="86" fill="#5a6b75"/>
  <rect x="300" y="628" width="26" height="42" fill="#3a2a12"/>
  <line x1="300" y1="628" x2="326" y2="628" stroke="#ff7b7b" stroke-width="2.5"/>
  <line x1="300" y1="670" x2="326" y2="670" stroke="#ff7b7b" stroke-width="2.5"/>

  <!-- kitchen side (right) -->
  <text x="360" y="600" fill="#8fa3ad" font-size="12">KITCHEN SIDE</text>
  <rect x="326" y="640" width="62" height="18" fill="#b8c0c8"/>
  <text x="396" y="654" fill="#a9bcc6" font-size="12">15″ stainless plating ledge</text>

  <!-- cafe side (left) -->
  <text x="150" y="600" fill="#8fa3ad" font-size="12" text-anchor="end">CAFE POS / FRONT OF HOUSE</text>
  <line x1="160" y1="649" x2="296" y2="649" stroke="#ffc981" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="228" y="640" fill="#ffc981" font-size="12" text-anchor="middle">order handed across</text>

  <!-- notes -->
  <text x="40" y="640" fill="#7f929d" font-size="12">Notes</text>
  <text x="40" y="660" fill="#a9bcc6" font-size="12">· sized for plated orders, not for pass-through of carts</text>
  <text x="40" y="678" fill="#a9bcc6" font-size="12">· clears the warewasher and dishtable as currently laid out</text>
  <text x="40" y="696" fill="#a9bcc6" font-size="12">· hand sink relocated south to suit</text>

  <text x="600" y="678" fill="#ff7b7b" font-size="12">Flow note: the pass is at the far east end, roughly 30 ft</text>
  <text x="600" y="696" fill="#ff7b7b" font-size="12">from this window. Worth Andrew’s view on the carry.</text>
</svg>
